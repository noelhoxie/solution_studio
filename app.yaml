command:
  - "sh"
  - "-c"
  - "gunicorn --bind 0.0.0.0:$DATABRICKS_APP_PORT --workers 2 --worker-class gthread --threads 4 --timeout 180 api:app"

resources:
  - name: sql-warehouse
    description: Shared SQL Warehouse for all Solution Studio sub-apps
    sql_warehouse:
      id: 17e5cb93c5f1758e
      permission: CAN_USE

