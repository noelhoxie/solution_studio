<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-label="Manufacturing plant schematic">
  <defs>
    <linearGradient id="floor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#141820"/>
      <stop offset="100%" style="stop-color:#0a0c10"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1e2838" stroke-width="0.5"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#floor)"/>
  <rect width="100%" height="100%" fill="url(#grid)" opacity="0.35"/>
  <!-- Outer building -->
  <rect x="20" y="40" width="920" height="340" rx="8" fill="none" stroke="#2a3548" stroke-width="2"/>
  <text x="40" y="32" fill="#5a6578" font-family="system-ui,sans-serif" font-size="13" font-weight="600">LAKEHOUSE PLANT  ASSET OVERVIEW</text>
  <!-- Bay dividers -->
  <line x1="340" y1="60" x2="340" y2="380" stroke="#2a3548" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="640" y1="60" x2="640" y2="380" stroke="#2a3548" stroke-width="1.5" stroke-dasharray="6 4"/>
  <!-- Line A zone tint -->
  <rect x="32" y="72" width="296" height="296" rx="4" fill="#FF8C00" fill-opacity="0.06" stroke="#FF8C00" stroke-opacity="0.25" stroke-width="1"/>
  <!-- Line B -->
  <rect x="352" y="72" width="276" height="296" rx="4" fill="#4CC9F0" fill-opacity="0.06" stroke="#4CC9F0" stroke-opacity="0.25" stroke-width="1"/>
  <!-- Line C -->
  <rect x="652" y="72" width="276" height="296" rx="4" fill="#A78BFA" fill-opacity="0.06" stroke="#A78BFA" stroke-opacity="0.25" stroke-width="1"/>
  <!-- Conveyor spine -->
  <path d="M 48 220 H 912" fill="none" stroke="#333d52" stroke-width="14" stroke-linecap="round"/>
  <path d="M 48 220 H 912" fill="none" stroke="#1a2230" stroke-width="8" stroke-linecap="round"/>
  <!-- Machine blocks Line A -->
  <g filter="url(#glow)">
    <rect x="56" y="120" width="72" height="52" rx="3" fill="#1c2433" stroke="#3d4a63"/>
    <rect x="144" y="100" width="72" height="52" rx="3" fill="#1c2433" stroke="#3d4a63"/>
    <rect x="232" y="130" width="72" height="52" rx="3" fill="#1c2433" stroke="#3d4a63"/>
    <rect x="56" y="268" width="72" height="52" rx="3" fill="#1c2433" stroke="#3d4a63"/>
    <rect x="200" y="268" width="72" height="52" rx="3" fill="#1c2433" stroke="#3d4a63"/>
  </g>
  <!-- Line B machines -->
  <g>
    <rect x="376" y="110" width="72" height="52" rx="3" fill="#1c2433" stroke="#3d4a63"/>
    <rect x="464" y="130" width="72" height="52" rx="3" fill="#1c2433" stroke="#3d4a63"/>
    <rect x="552" y="95" width="72" height="52" rx="3" fill="#1c2433" stroke="#3d4a63"/>
    <rect x="400" y="268" width="72" height="52" rx="3" fill="#1c2433" stroke="#3d4a63"/>
    <rect x="520" y="268" width="72" height="52" rx="3" fill="#1c2433" stroke="#3d4a63"/>
  </g>
  <!-- Line C machines -->
  <g>
    <rect x="676" y="115" width="72" height="52" rx="3" fill="#1c2433" stroke="#3d4a63"/>
    <rect x="764" y="100" width="72" height="52" rx="3" fill="#1c2433" stroke="#3d4a63"/>
    <rect x="852" y="125" width="72" height="52" rx="3" fill="#1c2433" stroke="#3d4a63"/>
    <rect x="700" y="268" width="72" height="52" rx="3" fill="#1c2433" stroke="#3d4a63"/>
    <rect x="820" y="268" width="72" height="52" rx="3" fill="#1c2433" stroke="#3d4a63"/>
  </g>
  <!-- Labels on diagram (decorative; live OEE is HTML overlay) -->
  <text x="180" y="360" fill="#666" font-size="11" font-family="system-ui" text-anchor="middle">LINE A  PPU FAB</text>
  <text x="490" y="360" fill="#666" font-size="11" font-family="system-ui" text-anchor="middle">LINE B  DLA ASM</text>
  <text x="790" y="360" fill="#666" font-size="11" font-family="system-ui" text-anchor="middle">LINE C  GAM INT</text>
</svg>
